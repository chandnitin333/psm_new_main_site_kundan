# In-container nginx — serves the SPA build with history fallback.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # PWA service worker must not be cached (so updates roll out)
    location = /sw.js        { add_header Cache-Control "no-cache"; try_files $uri =404; }
    location = /manifest.webmanifest { add_header Cache-Control "no-cache"; try_files $uri =404; }

    # hashed static assets — cache long
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        expires 7d;
        access_log off;
    }

    # SPA routes
    location / {
        try_files $uri $uri/ /index.html;
    }
}
